spring.application.name=Creral
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${CRERAL_DATABASE_URL}
spring.datasource.username=${CRERAL_DATABASE_USERNAME}
spring.datasource.password=${CRERAL_DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.main.banner-mode=off
logging.level.root=WARN
creral.internet.enabled=true
creral.internet.frontend-origin=${CRERAL_FRONTEND_ORIGIN}
